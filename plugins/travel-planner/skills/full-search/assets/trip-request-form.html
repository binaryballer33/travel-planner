<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip request</title>
<style>
:root { color-scheme: light; --bg:#f5f4f0; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e0da; --border-strong:#cfcdc5; --text:#0b0b0b; --text-2:#52514e; --muted:#8a8880; --accent:#2a78d6; --accent-ink:#fff; --accent-soft:#e4effb; --radius:12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg:#141413; --surface:#1a1a19; --surface-2:#232322; --border:#333331; --border-strong:#46453f; --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --accent:#3987e5; --accent-soft:#1d2d42; } }
:root[data-theme="dark"] { color-scheme: dark; --bg:#141413; --surface:#1a1a19; --surface-2:#232322; --border:#333331; --border-strong:#46453f; --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --accent:#3987e5; --accent-soft:#1d2d42; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--text-2); margin: 0 0 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row.three { grid-template-columns: 1fr 1fr 1fr; }
label { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-2); position: relative; }
label .req { color: var(--accent); }
.lbl { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
input, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px; padding: 9px 11px; width: 100%; }
input:focus, select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); font-weight: 400; }
.ac { position: absolute; top: 100%; left: 0; right: 0; z-index: 5; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; margin-top: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 280px; overflow: auto; display: none; }
.ac[data-open="true"] { display: block; }
.ac div { padding: 9px 12px; cursor: pointer; font-weight: 400; color: var(--text); display: flex; justify-content: space-between; gap: 10px; }
.ac div[aria-selected="true"], .ac div:hover { background: var(--accent-soft); }
.ac .code { color: var(--muted); font-variant-numeric: tabular-nums; }
.ac .src { font-size: 11px; color: var(--muted); }
.chk { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text); }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.out { background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; min-height: 48px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.err { color: #d03b3b; font-size: 13px; min-height: 18px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Trip request</h1>
  <p class="sub">Four things are required. Type a city or airport code and pick from the dropdown (casing doesn't matter). The box at the bottom becomes the prompt for the travel-planner skill.</p>
  <form class="card" id="f" autocomplete="off">
    <div class="row">
      <label><span class="lbl">Origin <span class="req">*</span></span>
        <input id="origin" placeholder="e.g. LAX or los angeles" required aria-autocomplete="list">
        <div class="ac" id="ac-origin" role="listbox"></div>
      </label>
      <label><span class="lbl">Destination <span class="req">*</span></span>
        <input id="dest" placeholder="e.g. rio" required aria-autocomplete="list">
        <div class="ac" id="ac-dest" role="listbox"></div>
      </label>
    </div>
    <div class="row">
      <label><span class="lbl">Check-in <span class="req">*</span></span><input id="checkin" type="date" required></label>
      <label><span class="lbl">Check-out <span class="req">*</span></span><input id="checkout" type="date" required></label>
    </div>
    <div class="row">
      <label><span class="lbl">Flight <span class="hint">lodging always uses both dates</span></span>
        <select id="triptype"><option value="">round trip (default)</option><option value="one way">one way</option></select>
      </label>
      <label><span class="lbl">Travelers <span class="hint">defaults to 1</span></span><input id="travelers" type="number" min="1" max="20" value="1"></label>
      <label><span class="lbl">Cabin <span class="hint">upper/luxury tiers upgrade anyway</span></span>
        <select id="cabin"><option value="">economy (default)</option><option>premium economy</option><option>business class</option><option>first class</option></select>
      </label>
    </div>
    <div class="row">
      <label><span class="lbl">Currency <span class="hint">defaults to USD</span></span><input id="currency" placeholder="USD" maxlength="3"></label>
      <label><span class="lbl">Children <span class="hint">optional</span></span><input id="children" type="number" min="0" max="10" placeholder="0"></label>
    </div>
    <label class="chk"><input id="car" type="checkbox"> I want a rental car ticked in the totals</label>
    <label><span class="lbl">Anything else <span class="hint">must-haves, budget, neighborhoods, "hostels only"…</span></span><input id="notes" placeholder="optional"></label>
    <div class="err" id="err"></div>
    <div>
      <div class="hint" style="margin-bottom:6px">Your prompt</div>
      <div class="out" id="out">/travel-planner:full-search …</div>
    </div>
    <div class="btns">
      <button type="button" class="primary" id="copy">Copy prompt</button>
      <button type="button" id="reset">Clear</button>
    </div>
  </form>
</div>

ata":"LOP","country":"Indonesia"},{"city":"canggu","iata":"DPS","country":"Indonesia"},{"city":"seminyak","iata":"DPS","country":"Indonesia"},{"city":"hue","iata":"HUI","country":"Vietnam"},{"city":"da lat","iata":"DLI","country":"Vietnam"},{"city":"dalat","iata":"DLI","country":"Vietnam"},{"city":"ha long","iata":"HPH","country":"Vietnam"},{"city":"halong bay","iata":"HPH","country":"Vietnam"},{"city":"sapa","iata":"HAN","country":"Vietnam"},{"city":"can tho","iata":"VCA","country":"Vietnam"},{"city":"sihanoukville","iata":"KOS","country":"Cambodia"},{"city":"koh rong","iata":"KOS","country":"Cambodia"},{"city":"mandalay","iata":"MDL","country":"Myanmar"},{"city":"bagan","iata":"NYU","country":"Myanmar"},{"city":"pune","iata":"PNQ","country":"India"},{"city":"ahmedabad","iata":"AMD","country":"India"},{"city":"udaipur","iata":"UDR","country":"India"},{"city":"jodhpur","iata":"JDH","country":"India"},{"city":"agra","iata":"DEL","country":"India"},{"city":"varanasi","iata":"VNS","country":"India"},{"city":"amritsar","iata":"ATQ","country":"India"},{"city":"srinagar","iata":"SXR","country":"India"},{"city":"leh","iata":"IXL","country":"India"},{"city":"kerala","iata":"COK","country":"India"},{"city":"trivandrum","iata":"TRV","country":"India"},{"city":"thiruvananthapuram","iata":"TRV","country":"India"},{"city":"pokhara","iata":"PKR","country":"Nepal"},{"city":"galle","iata":"CMB","country":"Sri Lanka"},{"city":"kandy","iata":"CMB","country":"Sri Lanka"},{"city":"chittagong","iata":"CGP","country":"Bangladesh"},{"city":"peshawar","iata":"PEW","country":"Pakistan"},{"city":"bukhara","iata":"BHK","country":"Uzbekistan"},{"city":"khiva","iata":"UGC","country":"Uzbekistan"},{"city":"dushanbe","iata":"DYU","country":"Tajikistan"},{"city":"ashgabat","iata":"ASB","country":"Turkmenistan"},{"city":"kabul","iata":"KBL","country":"Afghanistan"},{"city":"baghdad","iata":"BGW","country":"Iraq"},{"city":"erbil","iata":"EBL","country":"Iraq"},{"city":"damascus","iata":"DAM","country":"Syria"},{"city":"sanaa","iata":"SAH","country":"Yemen"},{"city":"shiraz","iata":"SYZ","country":"Iran"},{"city":"isfahan","iata":"IFN","country":"Iran"},{"city":"canberra","iata":"CBR","country":"Australia"},{"city":"newcastle australia","iata":"NTL","country":"Australia"},{"city":"byron bay","iata":"BNK","country":"Australia"},{"city":"sunshine coast","iata":"MCY","country":"Australia"},{"city":"townsville","iata":"TSV","country":"Australia"},{"city":"alice springs","iata":"ASP","country":"Australia"},{"city":"uluru","iata":"AYQ","country":"Australia"},{"city":"broome","iata":"BME","country":"Australia"},{"city":"launceston","iata":"LST","country":"Australia"},{"city":"tasmania","iata":"HBA","country":"Australia"},{"city":"whitsundays","iata":"HTI","country":"Australia"},{"city":"hamilton island","iata":"HTI","country":"Australia"},{"city":"rotorua","iata":"ROT","country":"New Zealand"},{"city":"dunedin","iata":"DUD","country":"New Zealand"},{"city":"nelson","iata":"NSN","country":"New Zealand"},{"city":"napier","iata":"NPE","country":"New Zealand"},{"city":"suva","iata":"SUV","country":"Fiji"},{"city":"moorea","iata":"MOZ","country":"French Polynesia"},{"city":"rarotonga","iata":"RAR","country":"Cook Islands"},{"city":"cook islands","iata":"RAR","country":"Cook Islands"},{"city":"apia","iata":"APW","country":"Samoa"},{"city":"samoa","iata":"APW","country":"Samoa"},{"city":"tonga","iata":"TBU","country":"Tonga"},{"city":"vanuatu","iata":"VLI","country":"Vanuatu"},{"city":"port vila","iata":"VLI","country":"Vanuatu"},{"city":"honiara","iata":"HIR","country":"Solomon Islands"},{"city":"palau","iata":"ROR","country":"Palau"},{"city":"saipan","iata":"SPN","country":"Northern Mariana Islands"}]/*CITIES-END*/;
  const SMALL = new Set(['de','da','do','del','des','di','du','la','le','las','los','el','of','and','on','the','al','en','sur']);
  const pretty = n => n.split(' ').map((w, i) => (i && SMALL.has(w.toLowerCase())) ? w.toLowerCase() : w[0].toUpperCase() + w.slice(1)).join(' ');
  const ascii = s => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function suggest(text, limit) {
    const key = ascii(text).replace(/-/g, ' ');
    if (!key) return [];
    const scored = [];
    for (const c of CITIES) {
      const name = c.city.toLowerCase(), code = c.iata.toLowerCase();
      let score;
      if (name.startsWith(key) || key === code) score = 0;
      else if (name.split(' ').some(w => w.startsWith(key))) score = 1;
      else if (name.includes(key)) score = 2;
      else if (key.length >= 2 && code.startsWith(key)) score = 3;
      else continue;
      scored.push({ score, len: name.length, c });
    }
    if (scored.some(s => s.score === 0 && s.c.iata.toLowerCase() === key)) scored.splice(0, scored.length, ...scored.filter(s => s.score === 0));
    scored.sort((a, b) => a.score - b.score || b.len - a.len);
    const out = [], seen = new Set();
    for (const s of scored) { const k = s.c.iata + '|' + s.c.country; if (seen.has(k)) continue; seen.add(k); out.push({ city: pretty(s.c.city), iata: s.c.iata, country: s.c.country }); if (out.length >= limit) break; }
    return out;
  }
  // Fallback for places outside the table: OpenStreetMap's Photon geocoder (no key). Airport code is resolved by the skill later.
  async function photon(text) {
    try {
      const r = await fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(text) + '&limit=6&lang=en');
      if (!r.ok) return [];
      const j = await r.json();
      return (j.features || []).filter(f => /^(city|town|village|state|county|island)$/.test(f.properties.type || '') || f.properties.osm_key === 'place')
        .map(f => ({ city: f.properties.name, iata: '', country: f.properties.country || '', src: 'OpenStreetMap' })).slice(0, 5);
    } catch (e) { return []; }
  }

  const picked = { origin: null, dest: null };
  function attach(id) {
    const input = document.getElementById(id), box = document.getElementById('ac-' + id);
    let items = [], active = -1, timer = null, seq = 0;
    const render = () => {
      box.innerHTML = items.map((it, i) => `<div role="option" aria-selected="${i === active}" data-i="${i}"><span>${esc(it.city)}${it.country ? ', ' + esc(it.country) : ''}</span><span class="code">${it.iata ? esc(it.iata) : `<span class="src">${esc(it.src || '')}</span>`}</span></div>`).join('');
      box.dataset.open = items.length ? 'true' : 'false';
    };
    const choose = i => { const it = items[i]; if (!it) return; picked[id] = it; input.value = it.iata ? `${it.city} (${it.iata})` : `${it.city}, ${it.country}`; items = []; active = -1; render(); update(); };
    input.addEventListener('input', () => {
      picked[id] = null; clearTimeout(timer);
      const text = input.value;
      timer = setTimeout(async () => {
        const mine = ++seq;
        items = suggest(text, 8); active = items.length ? 0 : -1; render();
        if (!items.length && text.trim().length >= 3) { const ph = await photon(text); if (mine === seq && !picked[id]) { items = ph; active = items.length ? 0 : -1; render(); } }
      }, 120);
      update();
    });
    input.addEventListener('keydown', e => {
      if (box.dataset.open !== 'true') return;
      if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(items.length - 1, active + 1); render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); render(); }
      else if (e.key === 'Enter') { e.preventDefault(); choose(active); }
      else if (e.key === 'Escape') { items = []; render(); }
    });
    input.addEventListener('blur', () => setTimeout(() => { items = []; render(); }, 150));
    box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); choose(+d.dataset.i); } });
  }
  attach('origin'); attach('dest');

  const $ = id => document.getElementById(id);
  const usDate = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${m}/${d}/${y}`; };
  const placeArg = (id) => { const p = picked[id]; const raw = $(id).value.trim(); if (p && p.iata) return p.iata; const v = p ? p.city : raw; return /\s/.test(v) ? `"${v}"` : v; };
  function update() {
    const err = [];
    const ci = $('checkin').value, co = $('checkout').value;
    if (ci && co && co <= ci) err.push('Check-out must be after check-in.');
    const parts = ['/travel-planner:full-search', placeArg('origin') || '<origin>', placeArg('dest') || '<destination>', usDate(ci) || '<mm/dd/yyyy>', usDate(co) || '<mm/dd/yyyy>'];
    const trav = parseInt($('travelers').value, 10);
    if (trav > 1) parts.push(String(trav));
    const extras = [];
    if ($('triptype').value) extras.push($('triptype').value + ' flight');
    if ($('cabin').value) extras.push($('cabin').value);
    const kids = parseInt($('children').value, 10); if (kids > 0) extras.push(`${kids} child${kids > 1 ? 'ren' : ''}`);
    if ($('currency').value.trim() && $('currency').value.trim().toUpperCase() !== 'USD') extras.push('prices in ' + $('currency').value.trim().toUpperCase());
    extras.push($('car').checked ? 'with a rental car' : 'no car by default');
    if ($('notes').value.trim()) extras.push($('notes').value.trim());
    $('out').textContent = parts.join(' ') + (extras.length ? ' — ' + extras.join(', ') : '');
    $('err').textContent = err.join(' ');
  }
  ['checkin', 'checkout', 'travelers', 'triptype', 'cabin', 'currency', 'children', 'car', 'notes'].forEach(id => { $(id).addEventListener('input', update); $(id).addEventListener('change', update); });
  $('copy').addEventListener('click', async () => {
    const t = $('out').textContent;
    try { await navigator.clipboard.writeText(t); $('copy').textContent = 'Copied'; } catch (e) { $('copy').textContent = 'Select and copy the text'; }
    setTimeout(() => { $('copy').textContent = 'Copy prompt'; }, 1500);
  });
  $('reset').addEventListener('click', () => { $('f').reset(); picked.origin = picked.dest = null; update(); });
  update();
})();
</script>
